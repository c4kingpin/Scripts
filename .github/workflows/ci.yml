name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Bash and ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      # Every script in the repository is checked, so a new project directory
      # is covered without touching this workflow.
      - name: Validate Bash syntax
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 -r -n1 bash -n

      - name: Run ShellCheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 -r shellcheck -x \
              --exclude=SC1090,SC1091

      - name: Run devbox regression tests
        run: bash devbox/tests/test-devbox.sh
