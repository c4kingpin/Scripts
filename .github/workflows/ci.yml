name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Bash and ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Validate Bash syntax
        run: >-
          bash -n
          ct/codex-devbox.sh
          install/codex-devbox-install.sh
          tests/test-codex-devbox.sh

      - name: Validate metadata JSON
        run: python3 -m json.tool json/codex-devbox.json >/dev/null

      - name: Run regression tests
        run: bash tests/test-codex-devbox.sh

      - name: Run ShellCheck
        run: >-
          shellcheck -x
          --exclude=SC1090,SC1091,SC2086,SC2154
          ct/codex-devbox.sh
          install/codex-devbox-install.sh
          tests/test-codex-devbox.sh
